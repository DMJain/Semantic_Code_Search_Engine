name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: codesearch
          POSTGRES_PASSWORD: codesearch
          POSTGRES_DB: codesearch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codesearch -d codesearch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://codesearch:codesearch@localhost:5432/codesearch?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "1"
      # `make test` is the single definition of "run every test": one uncached
      # run that fails if the database URL is missing or any test skips.
      - name: Test (no skips allowed)
        run: make test
        env:
          CGO_ENABLED: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: actionlint (pinned)
        run: make lint-ci
      - name: shellcheck scripts
        run: make lint-scripts
